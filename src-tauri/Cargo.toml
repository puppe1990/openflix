[package]
name = "life-tv"
version = "0.3.0"
description = "Player 10-foot de playlists próprias Xtream/M3U"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `unstable` liga o multiwebview: Window::add_child coloca o painel do Prime
# como webview filho da janela principal, sem virar uma janela do SO à parte.
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-http = "2.8.3"
reqwest = { version = "0.12", default-features = false, features = ["gzip", "json", "blocking", "rustls-tls"] }
rquickjs = "0.14"
serde_json = "1"
sha1 = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
