[package]
name = "life-tv"
version = "0.1.0"
description = "Player 10-foot de playlists próprias Xtream/M3U"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2.8.3"
reqwest = { version = "0.12", default-features = false, features = ["gzip", "rustls-tls"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
