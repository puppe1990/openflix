name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS aarch64
            platform: macos-latest
            args: --target aarch64-apple-darwin
            rust-targets: aarch64-apple-darwin
          - label: macOS x86_64
            platform: macos-latest
            args: --target x86_64-apple-darwin
            rust-targets: x86_64-apple-darwin
          - label: Linux
            platform: ubuntu-22.04
            args: ''
            rust-targets: ''
          - label: Windows
            platform: windows-latest
            args: ''
            rust-targets: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Install Linux WebKit
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install frontend
        run: npm ci

      - name: Bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: OpenFlix ${{ github.ref_name }}
          releaseBody: |
            OpenFlix ${{ github.ref_name }} — Xtream/M3U, Prime Video e YouTube no player 10-foot.

            Apps nesta release:
            - macOS Apple Silicon (`.dmg` / `.app.tar.gz`)
            - macOS Intel (`.dmg` / `.app.tar.gz`)
            - Windows (`.msi` / `.exe`)
            - Linux (`.deb` / AppImage)

            Login do Prime e do YouTube fica no app; DRM do Prime continua no player oficial da Amazon.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
